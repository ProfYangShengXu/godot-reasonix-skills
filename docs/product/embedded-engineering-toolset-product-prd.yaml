product:
  name: "嵌入式工程技能集 (Embedded Engineering Toolset)"
  one_liner: "面向嵌入式全栈的 AI Agent 工具箱 — 每个角色一个技能卡，Agent 按需加载角色能力"
  created_at: "2026-07-14T22:30:00+08:00"

success_metrics:
  north_star: "月活跃角色实例数 ≥ 2000"
  key_results:
    - name: "KR-1"
      description: "角色覆盖主流嵌入式领域"
      target: "16 个角色全部上架且有至少 1 个验证场景"
      measure: "角色清单 + 场景测试报告"
    - name: "KR-2"
      description: "从零到工具链跑通"
      target: "≤ 30 分钟（含软件安装指引）"
      measure: "新用户实操计时"
    - name: "KR-3"
      description: "技能调用成功率"
      target: "≥ 85%"
      measure: "Agent 调用 → 退出码 0 比例"

personas:
  - name: "MCU 固件新手"
    scenario: "在校学生或转行人员，刚接触 STM32/ESP32，做课设或毕设"
    pain_point: "环境搭建就要花一整天；寄存器配置、时钟树、引脚复用完全不懂"
    frequency: "每周 3-5 次（实验/课设期间密集）"
    need: "帮我搭好环境，告诉我每一步该干什么，别让我看 2000 页手册"
    tech_level: "低-中（会 C 但不会配环境）"
  - name: "嵌入式全栈老兵"
    scenario: "5 年+ 嵌入式经验，做 Linux BSP、驱动、QT 应用"
    pain_point: "跨平台切换时重复查手册；烧录脚本每个项目都要重新写"
    frequency: "每日使用"
    need: "每个平台的常用操作我都知道，帮我记住那些犄角旮旯的参数"
    tech_level: "高（能看芯片手册、写 linker script）"
  - name: "FPGA/数字逻辑工程师"
    scenario: "数字设计方向，写 Verilog/VHDL，用 Vivado/Quartus"
    pain_point: "仿真→综合→约束文件环节总卡住；Testbench 搭建费时；时序收敛全靠经验"
    frequency: "项目周期内每日，间歇期每周 1-2 次"
    need: "帮我写 Testbench、跑仿真，告诉我波形对不对"
    tech_level: "中-高（会写 HDL 但对工具链不熟）"

mvp:
  must_have:
    - "角色系统框架：16 个角色卡独立存储，嵌入式架构师可编排子角色"
    - "MCU 固件工程师：CubeMX2 CLI → HAL 代码 → Keil/IAR/ARM GCC 编译 → OpenOCD/J-Link 烧录"
    - "FPGA 工程师：Verilog/VHDL Testbench → ModelSim/Questa 仿真 → Vivado/Quartus 综合下载"
    - "硬件信号查询引擎：搜索芯片数据手册 → 提取寄存器/引脚/时序参数"
    - "安装示例文档：每角色附带面向零基础用户的安装指引"
    - "Linux 应用/驱动工程师：交叉编译 → Device Tree → Kernel Module → scp/tftp 部署"
    - "烧录/调试统一接口：抽象 OpenOCD/J-Link/ST-Link/DAP-Link/pyOCD"
    - "QT/C++ 编译工程支持：qmake/cmake → 交叉编译 → 部署"
  nice_to_have:
    - "P2 电源/射频工程师：LTspice 仿真 + S 参数分析"
    - "P2 功能安全工程师：MISRA-C 检查自动化"
    - "P2 模型量化部署工程师：TF Lite/ONNX → MCU/边缘 NPU"
    - "P2 BMS 软件工程师：电池 SOX 算法 + BQ76952/ADBMS 驱动模板"
    - "P3 CI/CD 集成：GitHub Actions 一键编译 + 仿真回归"
  out_of_scope:
    - "硬件原理图自动设计"
    - "实时操作系统调度器实现（只封装 FreeRTOS/Zephyr 配置和 API）"
    - "代做竞赛/考试题目"
    - "PCB Layout 自动布线"
    - "一期只覆盖 STM32F/H/G + ESP32 + Cyclone IV/V + Artix-7"

competitors:
  - name: "STM32CubeMX GUI"
    positioning: "ST 官方图形化配置工具"
    strength: "官方支持，引脚可视化，冲突检查完善"
    weakness: "需手动操作 GUI，不能被 AI 脚本调用"
    difference: "本工具把 CubeMX CLI 暴露给 Agent，可脚本化"
  - name: "PlatformIO"
    positioning: "嵌入式开发统一平台"
    strength: "统一 CLI，多框架支持"
    weakness: "配置格式固定，不支持高级调试"
    difference: "角色化处理不同工具链，更灵活"
  - name: "OpenOCD + custom scripts"
    positioning: "开源调试/烧录工具"
    strength: "灵活，支持多平台"
    weakness: "配置复杂，每次换芯片要重写配置"
    difference: "封装成统一接口，根据芯片型号自动选配置"
  - name: "厂商 FAE 支持"
    positioning: "芯片厂商技术支持"
    strength: "专业，官方权威"
    weakness: "响应慢（几天），不覆盖非官方方案"
    difference: "即时响应，24/7 可用"

swot:
  strengths:
    - "已有 NUEDC Skills 7 个技能的成功实践和社区验证"
    - "16 个角色覆盖嵌入式全链路，填补 AI 在嵌入式领域的空白"
    - "每个角色独立存储，可按需加载不冲突"
    - "面向零基础用户的安装文档是独特竞争力"
  weaknesses:
    - "团队规模小，维护 16 个角色需要大量精力"
    - "嵌入式工具链版本碎片化严重"
    - "依赖第三方闭源工具（Keil、Quartus、Vivado）无法开源分发"
    - "缺乏真实硬件测试环境覆盖所有芯片组合"
  opportunities:
    - "AI Agent 生态爆发，垂直领域工具需求大增"
    - "嵌入式领域 AI 工具几乎空白，是蓝海市场"
    - "RISC-V 生态崛起带来更多碎片化需求"
    - "高校电赛/机器人赛每年数万参赛者急需降低工具链门槛"
  threats:
    - "ST/ARM/AMD 等大厂可能推出官方 AI 助手"
    - "嵌入式开发者对 AI 信任度不高——烧录不能出错的零容忍心态"
    - "工具链版本更新可能破坏已有角色配置"
    - "竞品快速跟进——知识积累不是技术壁垒"

risks:
  - category: "市场风险"
    description: "目标用户群太小——需要 AI Agent 工具 + 做嵌入式开发的交集"
    likelihood: "中"
    impact: "高"
    mitigation: "先用 NUEDC 电赛场景验证 PMF；电赛每年数万参赛者是最直接的种子用户"
  - category: "运营风险"
    description: "工具链版本更新导致角色指令失效"
    likelihood: "高"
    impact: "中"
    mitigation: "每个角色标注已验证的工具版本号；建立版本兼容性矩阵；接受社区 PR"
  - category: "增长风险"
    description: "冷启动——无人知道工具集，无人贡献新角色"
    likelihood: "高"
    impact: "中"
    mitigation: "从 NUEDC Skills 已有用户迁移；在嵌入式社区推广"
  - category: "变现风险"
    description: "开源免费的定位下难找到可持续收入模型"
    likelihood: "中"
    impact: "中"
    mitigation: "核心开源免费 + 企业版收费 + 社区捐赠"
