product:
  name: "Godox Plugin"
  one_liner: "像 VSCode Copilot 有 Language Server 一样，给 Godot Reasonix 技能集一个原生编辑器 API 通道"
  created_at: "2026-07-12T00:00:00+08:00"

success_metrics:
  north_star: "通过插件完成的调试会话占比 ≥ 60%"
  key_results:
    - name: "KR-1"
      description: "插件操作的场景 0% 因格式问题被 Godot 拒绝加载"
      target: "0% 场景加载拒绝率"
      measure: "CaptureLogs 统计 'Parse Error' 出现频率"
    - name: "KR-2"
      description: "LLM 诊断的根因定位准确率从 40% 提升到 70%"
      target: "诊断准确率 ≥ 70%"
      measure: "A/B 测试：同一 bug 用文件操作 vs 插件诊断，人工判断准确率"
    - name: "KR-3"
      description: "安装 Godot Reasonix 技能集的用户中 30% 同时安装了 godox-plugin"
      target: "插件采纳率 ≥ 30%"
      measure: "GitHub Release 下载统计 / 插件管理器安装数"

personas:
  - name: "AI Agent 开发者"
    scenario: "维护 Godot Reasonix 技能集的开发者，需要让技能集更可靠，不用再猜测 .tscn 格式"
    pain_point: ".tscn 格式猜测消耗大量维护精力，每次 Godot 小版本更新都要改代码"
    frequency: "每周数次（发布新版本时）"
    need: "插件接管所有场景和脚本操作，不用再维护 .tscn 格式映射表"
    tech_level: "高：熟悉 GDScript、EditorPlugin API、MCP 协议"
  - name: "AI Native 游戏开发者"
    scenario: "用 AI Agent 写 Godot 游戏的独立开发者，卡在调试和场景验证环节"
    pain_point: "Agent 写的场景打开报错、碰撞参数不对、信号连不上——每次都要进编辑器手动修正"
    frequency: "每次开发会话都用"
    need: "Agent 直接在编辑器里改场景、加节点、连信号，只需要验收"
    tech_level: "中：会写 GDScript，用 AI Agent 主力开发"
  - name: "Godot 工具链维护者"
    scenario: "Godot 社区工具开发者，关注编辑器扩展生态"
    pain_point: "Agent 文件操作绕过编辑器，导致版本兼容问题和不可靠的场景编辑"
    frequency: "项目需要时"
    need: "插件提供一个稳定的 MCP 接口，其他工具也可以接入"
    tech_level: "高：Godot 工具链开发者"

mvp:
  must_have:
    - "MCP Server 核心：暴露 get_scene_tree/add_node/remove_node/set_node_property/attach_script"
    - "输入中继基础：UDP socket 接收按键事件，调用 Input.parse_input_event()"
    - "结构化日志通道：拦截 print()/push_error()，JSON 实时推送"
    - "场景验证：validate_scene(path) 调用 ResourceLoader.load() 返回精确错误"
    - "插件自动发现：Agent 检测插件安装状态，自动切换通道"
  nice_to_have:
    - "调试桥：设置断点、读取调用栈、检查变量值"
    - "鼠标事件模拟"
    - "游戏截图通道"
    - "资源浏览器 API"
    - "信号连接可视化"
  out_of_scope:
    - "编辑器 UI 扩展（不添加面板/按钮/dock）"
    - "Godot 3.x 兼容"
    - "多人协作（一实例一连接）"
    - "Web 导出"

competitors:
  - name: "Godot 官方编辑器"
    positioning: "完整游戏开发 IDE"
    strength: "原生支持所有编辑器功能"
    weakness: "无 API 暴露给外部 Agent"
    difference: "插件给了 Agent 一个 API 通道，不替代编辑器本身"
  - name: "Godot GDScript 调试器"
    positioning: "运行时调试"
    strength: "完整的断点/步进/变量监视"
    weakness: "需要人手动操作，Agent 无法调用"
    difference: "插件通过 MCP 暴露调试能力给 Agent"
  - name: "现有文件操作模式"
    positioning: "Agent 通过文件系统操作 Godot 项目"
    strength: "无需编辑器、跨平台、可版本控制"
    weakness: ".tscn 格式猜测、不能输入模拟、日志靠正则"
    difference: "插件是文件操作模式的进化版——直接从编辑器 API 获取真实状态"
  - name: "VSCode Copilot + Godot 扩展"
    positioning: "AI 辅助代码编写"
    strength: "强大的代码补全和生成"
    weakness: "只能写 .gd 代码，不能操作场景和调试"
    difference: "插件直接与编辑器对话，不只是代码生成"

swot:
  strengths:
    - "Godot Reasonix 技能集已有完整的 M1-M11 工具链和 100 测试"
    - "技能集已在实际项目中被验证"
    - "MCP 协议是 Reasonix 原生支持的，插件接入成本低"
  weaknesses:
    - "团队无 Godot EditorPlugin 开发经验"
    - "Godot 的 MCP 生态为 0——需要从零建"
    - "EditorPlugin API 文档不完整，需要试错"
  opportunities:
    - "Godot 4.x 用户快速增长（Steam 占比 ~3%）"
    - "AI 编程 Agent 用户量在快速增长"
    - "目前市场上无任何 Godot Editor MCP 插件——先发优势"
  threats:
    - "Godot 官方可能自己实现 MCP 或类似协议"
    - "EditorPlugin API 在 Godot 小版本间有破坏性变更"
    - "社区可能很快出现竞品 MCP 插件"

risks:
  - category: "市场风险"
    description: "市场需求过小——「用 AI Agent 调试 Godot」是一个极细分的需求"
    likelihood: "高"
    impact: "中"
    mitigation: "插件作为免费开源工具发布，不依赖插件转化收入；它提升现有技能集的价值，而非独立获客"
  - category: "运营风险"
    description: "Godot EditorPlugin API 在 4.x 小版本间有破坏性变更"
    likelihood: "中"
    impact: "高"
    mitigation: "锁定最低支持版本（如 4.3+），文档中明确声明兼容范围；CI 用多个 Godot 版本测试"
  - category: "运营风险"
    description: "MCP stdio 模式下插件的进程生命周期管理复杂"
    likelihood: "中"
    impact: "中"
    mitigation: "插件在 EditorPlugin._exit_tree() 中强制清理子进程；Agent 侧设超时兜底"
  - category: "增长风险"
    description: "冷启动——没有用户知道这个插件存在"
    likelihood: "高"
    impact: "中"
    mitigation: "插件随 Godot Reasonix 技能集 v3.0 一起发布；在 Godot Asset Library 上架"
  - category: "变现风险"
    description: "开源插件无法直接变现"
    likelihood: "中"
    impact: "低"
    mitigation: "插件本身不开源也不收费——它提升技能集的价值，技能集通过企业许可证/LLM API 代理变现"
